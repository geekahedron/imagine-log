<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Imagine log</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313c;
    --text: #e6e4de; --muted: #8d93a1; --pass: #7dcea0;
    --fail: #e07a7a; --hold: #d4b483; --accent: #c4b49a; --tile: 120px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 12px; border-bottom: 1px solid var(--line); }
  header .filters, #bulk { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0; }
  header input, header select, header button { padding: 4px 8px; }
  #bulk { display: none; margin-top: 6px; }
  #bulk.on { display: flex; }
  .scale { position: fixed; left: 12px; bottom: 12px; z-index: 6; display: flex; gap: 8px; align-items: center; background: #1c1a17; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .scale input { width: 120px; }
  .dock { position: fixed; right: 12px; bottom: 12px; z-index: 6; display: flex; gap: 8px; align-items: center; background: #1c1a17; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .dock p { margin: 0; color: var(--muted); font-size: 12px; max-width: 220px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header p, .note { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 16px; }
  input, select, textarea, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button.primary { background: #3a342c; color: var(--accent); width: auto; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .filters label { display: flex; flex-direction: column; gap: 2px; margin: 0; text-transform: none; letter-spacing: 0; font-size: 10px; color: var(--muted); }
  .filters label select, .filters label input { width: auto; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  li.group { width: fit-content; max-width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #1c1a17; }
  li.group.open { width: 100%; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; }
  .tilebtn { position: relative; width: var(--tile); padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); text-align: left; overflow: hidden; }
  .tilebtn img { width: var(--tile); height: var(--tile); object-fit: cover; display: block; background: #000; }
  .tilebtn.picked { outline: 2px solid #7dcea0; }
  .tilebtn.candidate { background: #3a3228; box-shadow: inset 0 0 0 2px #d4a574; }
  .tilebtn.on { background: #2a3140; }
  #bulk { display: none; margin-top: 6px; }
  #bulk.on { display: flex; }
  .mark { position: absolute; z-index: 1; color: #fff; font-size: 22px; line-height: 1; pointer-events: none; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 1px 2px #000; }
  .half { position: relative; display: inline-block; width: 1em; height: 1em; font-size: 22px; }
  .half i { position: absolute; left: 0; top: 0; width: 0.4em; overflow: hidden; font-style: normal; }
  .mark.tl { top: 4px; left: 4px; }
  .mark.tr { top: 4px; right: 4px; }
  .mark.bl { top: calc(var(--tile) - 18px); left: 4px; font-size: 11px; }
  .mark.br { top: calc(var(--tile) - 22px); right: 4px; }
  .mark.folder { filter: grayscale(1) brightness(8); }
  .cap { display: flex; justify-content: space-between; gap: 4px; padding: 4px 6px 6px; font-size: 11px; color: var(--muted); }
  .cap b { color: var(--text); font-weight: 600; }
  .stars { cursor: pointer; }
  .mediarow { display: flex; gap: 12px; align-items: flex-start; margin: 8px 0; }
  li.group.open .detail { display: block; }
  .pick { display: none; gap: 6px; overflow-x: auto; padding: 6px 0; }
  .pick.open { display: flex; }
  .pick button { width: 64px; height: 64px; padding: 0; border-radius: 6px; overflow: hidden; }
  .pick button.on { outline: 2px solid var(--accent); }
  .pick img { width: 64px; height: 64px; object-fit: cover; display: block; }
  .badge { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  .pass { color: var(--pass); } .fail { color: var(--fail); } .partial { color: var(--hold); }
  .detail { display: none; margin-top: 10px; }
  li.open .detail { display: block; }
  .detail img.preview, .detail video { max-width: 100%; max-height: 70vh; border-radius: 6px; background: #000; }
  label { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
  textarea, select.wide, input.wide { width: 100%; }
  textarea { min-height: 90px; }
  .parent-opt { display: flex; align-items: center; gap: 8px; }
  .thumb { width: 42px; height: 42px; object-fit: cover; border-radius: 4px; background: #000; }
  label.inline { display: inline-flex; align-items: center; gap: 4px; text-transform: none; letter-spacing: 0; margin: 0; }
  #missbox { display: none; gap: 8px; align-items: flex-start; margin: 8px 0; }
  #missbox.on { display: flex; }
  #missbox textarea { flex: 1; min-height: 48px; }
  .readrow { display: flex; gap: 12px; align-items: flex-start; }
  .parentnow { width: 72px; flex: none; }
  .parentnow img, .parentnow button { width: 72px; height: 72px; }
  .notes { font-style: italic; color: var(--muted); }
  .title { font-weight: 600; margin: 6px 0; }
  .promptrow { display: flex; flex-wrap: nowrap; gap: 8px; align-items: stretch; width: 100%; }
  .promptrow textarea { flex: 1; min-width: 0; width: auto; min-height: 4.5em; max-height: 24em; field-sizing: content; overflow: auto; }
  .promptrow button { flex: none; align-self: stretch; height: auto; }
  .editbox { display: none; }
  .editbox.on { display: block; }
</style>
</head>
<body>
<header>
  <div class="filters">
    <label>search<input id="q" placeholder="" /></label>
    <label>status<select id="fstatus"><option value=""></option><option>pass</option><option>fail</option><option>partial</option></select></label>
    <label>kind<select id="fkind"><option value=""></option><option value="still">still</option><option value="video">video</option><option value="hasclips">stills with clips</option></select></label>
    <label>style<select id="fstyle"><option value=""></option></select></label>
    <label>tagged<select id="ftag"><option value=""></option><option value="no">untagged</option><option value="yes">has prompt</option></select></label>
    <label>rating<select id="frate"><option value=""></option><option value="5">5</option><option value="4">4+</option><option value="3">3+</option><option value="low">0–2</option><option value="0">unrated</option></select></label>
    <label>nsfw<select id="fnsfw"><option value=""></option><option value="include">include nsfw</option><option value="only">nsfw only</option></select></label>
    <label>sort<select id="sort"><option value="new">newest file</option><option value="old">oldest file</option><option value="name">filename</option><option value="rating">rating</option></select></label>
    <label>collapsed<input id="collapsed" type="checkbox" /></label>
    <button type="button" id="clearfilters" hidden>Clear filters</button>
  </div>
  <div id="bulk">
    <span id="bulkcount"></span>
    <select id="bulkstyle"></select>
    <input id="bulktags" placeholder="tags, comma separated" />
    <input id="bulkprompt" placeholder="prompt for all selected" />
    <select id="bulknsfw"><option value="">nsfw unchanged</option><option value="yes">mark nsfw</option><option value="no">clear nsfw</option></select>
    <button type="button" id="bulkapply">Apply to selected</button>
    <button type="button" id="bulkaddtags">Add tags</button>
    <button type="button" id="bulkclear">Deselect all</button>
    <button type="button" id="bulkdelete">Delete</button>
  </div>
  <div id="missbox">
    <textarea id="missprompt" placeholder="Prompt that failed"></textarea>
    <select id="misskind"><option value="still">failed still</option><option value="video">failed video</option></select>
    <button type="button" id="missadd">Add</button>
  </div>
</header>
<main>
  <p class="note" id="hint"></p>
  <ul class="list" id="list"></ul>
</main>
<div class="scale">
  <input id="scale" type="range" min="72" max="240" value="120" />
</div>
<div class="dock">
  <p id="status">Loading…</p>
  <button class="primary" id="match" type="button">Match clips</button>
  <button class="primary" id="save" type="button">Save</button>
  <button type="button" id="missopen">Log miss</button>
</div>
<script src="catalog.js"></script>
<script>
document.getElementById("status").textContent = "Script started";
const VID = /\.(mp4|webm|mov)$/i;
let files = [];
let mtimes = new Map();
let durations = new Map();
let styles = ["photoreal", "anime", "pixar", "sketch", "3D render", "cyberpunk"];
let records = new Map();
let picked = new Set();

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function kindOf(name) { return VID.test(name) ? "video" : "still"; }
function stemOf(name) { return name.replace(/\.[^.]+$/, ""); }
function guidOf(name) {
  return stemOf(name).slice(0, 47);
}
function recFor(name) {
  const id = stemOf(name);
  if (!records.has(id)) {
    records.set(id, {
      id, file: "media/" + name, kind: kindOf(name),
      status: "pass", client: "", style: "", tags: [],
      prompt: "", notes: "", parent: null, conversation: "", date: ""
    });
  }
  const r = records.get(id);
  r.file = "media/" + name;
  r.kind = kindOf(name);
  if (!r.status) r.status = "pass";
  return r;
}
function shortId(name) {
  return guidOf(name).slice(-10) + (stemOf(name).slice(47) || "");
}
function convsOf(rec) {
  const raw = rec && rec.conversation;
  const list = Array.isArray(raw) ? raw : String(raw || "").split(",");
  return [...new Set(list.map(s => s.trim()).filter(Boolean))];
}
function addConv(rec, id) {
  if (!id) return;
  const list = convsOf(rec);
  if (!list.includes(id)) list.push(id);
  rec.conversation = list;
}
function labelOf(rec, name) {
  return (rec && rec.label) || shortId(name);
}
function stills() {
  return files.filter(n => kindOf(n) === "still").map(n => recFor(n));
}
function starsOf(n) {
  n = n || 0;
  return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
}
function starBar(rec, after) {
  const bar = el("span", "stars", starsOf(rec.stars));
  bar.onclick = (ev) => {
    ev.stopPropagation();
    const rect = bar.getBoundingClientRect();
    rec.stars = Math.min(5, Math.max(1, Math.ceil((ev.clientX - rect.left) / rect.width * 5)));
    bar.textContent = starsOf(rec.stars);
    if (!rec.date) rec.date = new Date().toISOString().slice(0, 10);
    document.getElementById("status").textContent = "Rated.";
    scheduleSave();
    if (after) after();
  };
  return bar;
}
function say(text) {
  document.getElementById("status").textContent = text;
  console.log("[imagine-log] " + text);
}
async function loadAll() {
  if (location.protocol === "file:") {
    document.getElementById("status").textContent = "Opened as a file.";
    document.getElementById("hint").textContent = "Edge will not list the folder from a file:// page. Close this and double-click start.bat.";
    return;
  }
  document.getElementById("status").textContent = "Asking for the file list…";
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  let names, styleList;
  try {
    [names, styleList] = await Promise.all([
      fetch("/api/media", { signal: ctrl.signal }).then(r => r.json()),
      fetch("/api/styles", { signal: ctrl.signal }).then(r => r.json()).catch(() => styles)
    ]);
  } catch (err) {
    document.getElementById("status").textContent = "List did not answer. Restart start.bat, then refresh.";
    document.getElementById("hint").textContent = err.message;
    return;
  }
  clearTimeout(timer);
  if (Array.isArray(styleList) && styleList.length) styles = styleList;
  const styleFilter = document.getElementById("fstyle");
  styles.forEach(s => {
    const o = document.createElement("option");
    o.value = s; o.textContent = s;
    styleFilter.appendChild(o);
  });
  (window.CATALOG || []).forEach(r => {
    if (!r) return;
    const key = r.file ? stemOf(r.file.split("/").pop()) : r.id;
    records.set(key, Object.assign({}, r, { id: key }));
  });
  files = names.map(x => (typeof x === "string" ? x : x.name));
  mtimes = new Map(names.map(x => [typeof x === "string" ? x : x.name, (x && x.mtime) || 0]));
  thumbs = new Map(names.map(x => [typeof x === "string" ? x : x.name, (x && x.thumb) || ""]));
  durations = new Map(names.map(x => [typeof x === "string" ? x : x.name, (x && x.duration) || 0]));
  try {
    const cached = await fetch("/thumbs/durations.json").then(r => r.ok ? r.json() : {});
    Object.entries(cached || {}).forEach(([name, secs]) => durations.set(name, secs));
  } catch (err) {}
  files.forEach(recFor);
  try {
    const res = await fetch("/api/imports");
    if (!res.ok) throw new Error("imports endpoint " + res.status);
    const payload = await res.json();
    const imported = Array.isArray(payload) ? payload : (payload.records || []);
    console.log("[imagine-log] catalog files", payload.files || [], "rows", imported.length, "errors", payload.errors || []);
    const byKey = new Map();
    function addRow(key, row) {
      if (!key) return;
      if (!byKey.has(key)) byKey.set(key, []);
      byKey.get(key).push(row);
    }
    imported.forEach(r => {
      const named = ((r.file || "").split("/").pop() || "").replace(/\.[^.]+$/, "").toLowerCase();
      const uuid = ((r.file || r.id || "").match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i) || [])[0];
      addRow(named, r);
      if (uuid) addRow(uuid.toLowerCase(), r);
    });
    let filled = 0;
    let matched = 0;
    let linked = 0;
    imported.forEach(src => {
      const named = ((src.file || "").split("/").pop() || "");
      const stem = named.replace(/\.[^.]+$/, "");
      const uuid = ((src.file || src.id || "").match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i) || [])[0];
      const name = files.find(n => stemOf(n).toLowerCase() === stem.toLowerCase() || (uuid && n.toLowerCase().includes(uuid.toLowerCase())));
      const key = name ? stemOf(name) : stem;
      if (!key) return;
      if (!records.has(key)) {
        records.set(key, {
          id: key, file: name ? "media/" + name : (src.file || ""), kind: src.kind || kindOf(name || named),
          status: "pass", style: "", tags: [], prompt: "", notes: "", parent: null, conversation: [], date: ""
        });
      }
      const rec = records.get(key);
      if (name) matched += 1;
      const before = convsOf(rec).length;
      const blank = !rec.prompt || /^Grok Imagine by SpaceXAI/.test(rec.prompt);
      if (src.prompt && blank) { rec.prompt = src.prompt; filled += 1; }
      const ids = Array.isArray(src.conversation) ? src.conversation : String(src.conversation || "").split(",");
      ids.forEach(id => addConv(rec, id.trim()));
      if (convsOf(rec).length > before) linked += 1;
    });
    console.log("[imagine-log] " + matched + " files matched, " + filled + " prompts copied, " + linked + " conversations linked");
    if (filled || linked) saveCatalog();
    document.getElementById("hint").textContent = filled + " prompts, " + linked + " conversations from imports/.";
    say(files.length + " files in media/. " + filled + " prompts, " + linked + " conversations.");
  } catch (err) {
    say("Prompt file was not read: " + err.message);
    console.log(err);
  }
  loadPrefs();
  filtersOn();
  render();
  if (files.some(n => kindOf(n) === "video" && (!thumbs.get(n) || !durations.get(n)))) {
    window._thumbTries = (window._thumbTries || 0) + 1;
    if (window._thumbTries < 8) setTimeout(loadAll, 3000);
  } else window._thumbTries = 0;
}
function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const st = document.getElementById("fstatus").value;
  const kd = document.getElementById("fkind").value;
  const fs = document.getElementById("fstyle").value;
  const tag = document.getElementById("ftag").value;
  const sort = (document.getElementById("sort") || { value: "new" }).value;
  const rate = document.getElementById("frate").value;
  const list = document.getElementById("list");
  list.innerHTML = "";
  function wanted(r, name) {
    if (st && r.status !== st) return false;
    if (kd === "still" && r.kind !== "still") return false;
    if (kd === "video" && r.kind !== "video") return false;
    if (kd === "hasclips" && r.kind !== "still") return false;
    if (fs && r.style !== fs) return false;
    const tagged = !!(r.prompt && r.prompt.trim());
    if (tag === "no" && tagged) return false;
    if (tag === "yes" && !tagged) return false;
    const stars = Number(r.stars) || 0;
    if (rate === "5" && stars !== 5) return false;
    if (rate === "4" && stars < 4) return false;
    if (rate === "3" && stars < 3) return false;
    if (rate === "low" && (stars < 1 || stars > 2)) return false;
    if (rate === "0" && stars !== 0) return false;
    const nsfw = document.getElementById("fnsfw").value;
    if (!nsfw && r.nsfw) return false;
    if (nsfw === "only" && !r.nsfw) return false;
    if (!q) return true;
    return [name || "", r.id, r.prompt, r.notes, convsOf(r).join(" "), (r.tags || []).join(" "), r.style].join(" ").toLowerCase().includes(q);
  }
  const rows = files.filter(name => wanted(recFor(name), name));
  rows.sort((a, b) => {
    if (sort === "name") return a.localeCompare(b);
    if (sort === "rating") return (Number(recFor(b).stars) || 0) - (Number(recFor(a).stars) || 0);
    const d = (mtimes.get(a) || 0) - (mtimes.get(b) || 0);
    return sort === "old" ? d : -d;
  });
  if (!rows.length) list.appendChild(el("p", "empty", "Nothing in media/ yet."));
  const parents = stills();
  const hideClips = kd === "still" || kd === "video";
  const childOf = new Map();
  const orphans = [];
  function sameParent(parent, still) {
    if (!parent || !still) return false;
    const uuid = (still.id.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i) || [])[0];
    return parent === still.id || parent === guidOf(still.file) || parent === uuid;
  }
  files.forEach(name => {
    const r = recFor(name);
    if (r.kind !== "video" || !r.parent) return;
    const key = parents.find(p => sameParent(r.parent, p));
    if (!key) return;
    if (!childOf.has(key.id)) childOf.set(key.id, []);
    childOf.get(key.id).push(name);
  });
  rows.forEach(name => {
    const r = recFor(name);
    if (r.kind !== "video") return;
    const key = r.parent && parents.find(p => sameParent(r.parent, p));
    if (!key) orphans.push(name);
  });
  const stillRows = rows.filter(name => recFor(name).kind === "still" && (kd !== "hasclips" || (childOf.get(recFor(name).id) || []).length));
  function convMore(rec) {
    if (!convsOf(rec).length) return false;
    return files.some(name => convsOf(recFor(name)).some(id => convsOf(rec).includes(id)) && !rows.includes(name));
  }
  function addGroup(headName, childNames, convId) {
    const r = headName ? recFor(headName) : null;
    const li = el("li", "group");
    const tiles = el("div", "tiles");
    const detail = el("div", "detail");
    let openName = "";
    function select(name) {
      if (openName === name && li.classList.contains("open")) {
        li.classList.remove("open");
        tiles.querySelectorAll(".tilebtn").forEach(b => b.classList.remove("on"));
        openName = "";
        return;
      }
      document.querySelectorAll("li.group.open").forEach(n => {
        n.classList.remove("open");
        n.querySelectorAll(".tilebtn.on").forEach(b => b.classList.remove("on"));
      });
      openName = name;
      document.getElementById("status").textContent = labelOf(recFor(name), name);
      tiles.querySelectorAll(".tilebtn").forEach(b => b.classList.toggle("on", b.dataset.name === name));
      li.classList.add("open");
      fill(recFor(name), name);
    }
    function makeTile(name) {
      const rec = recFor(name);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tilebtn";
      b.dataset.name = name;
      const img = el("img");
      const mid = thumbs.get(name);
      const parentStill = rec.parent && [...records.values()].find(p => p.kind === "still" && (p.id === rec.parent || guidOf(p.file) === rec.parent));
      if (mid) img.src = mid;
      else if (rec.kind === "still") img.src = "media/" + encodeURIComponent(name);
      else if (parentStill) img.src = parentStill.file;
      b.appendChild(img);
      const stars = rec.stars || 0;
      if (stars >= 4) b.appendChild(el("div", "mark tl", "★"));
      else if (stars >= 2) {
        const half = el("span", "half", "☆");
        half.appendChild(el("i", "", "★"));
        const mark = el("div", "mark tl");
        mark.appendChild(half);
        b.appendChild(mark);
      } else if (stars === 1) b.appendChild(el("div", "mark tl", "☆"));
      if (rec.nsfw) b.appendChild(el("div", "mark tr", "👁"));
      if (rec.kind === "video") {
        const secs = durations.get(name) || 0;
        const clock = secs ? Math.floor(secs / 60) + ":" + Math.round(secs % 60).toString().padStart(2, "0") : "";
        if (clock) b.appendChild(el("div", "mark bl", clock));
        b.appendChild(el("div", "mark br", "▶"));
      } else if (hideClips && convMore(rec)) {
        b.appendChild(el("div", "mark br folder", "📁"));
      }
      const cap = el("div", "cap");
      cap.appendChild(el("b", "", labelOf(rec, name)));
      cap.appendChild(document.createTextNode((name.split(".").pop() || "").toLowerCase()));
      b.appendChild(cap);
      const marked = convId && (rec.cover || []).includes(convId);
      b.classList.toggle("candidate", !!marked && !document.getElementById("collapsed").checked);
      b.classList.toggle("picked", picked.has(name));
      b.onclick = (ev) => {
        if (ev.shiftKey && convId) {
          ev.preventDefault();
          files.forEach(n => {
            const other = recFor(n);
            other.cover = (other.cover || []).filter(id => id !== convId);
          });
          rec.cover = [...(rec.cover || []), convId];
          say("Cover set for " + convId.slice(0, 8));
          scheduleSave();
          render();
          return;
        }
        if (ev.ctrlKey || ev.metaKey) {
          ev.preventDefault();
          if (picked.has(name)) picked.delete(name);
          else picked.add(name);
          b.classList.toggle("picked", picked.has(name));
          document.getElementById("status").textContent = selectedTargets().length + " selected";
          showBulk();
          return;
        }
        select(name);
      };
      return b;
    }
    if (headName) tiles.appendChild(makeTile(headName));
    if (!hideClips && !document.getElementById("collapsed").checked) (childNames || []).forEach(n => tiles.appendChild(makeTile(n)));
    function fill(rec, name) {
      detail.innerHTML = "";
      detail.appendChild(el("div", "meta", rec.file || "no file, logged miss"));
      detail.appendChild(starBar(rec));
      const mediaRow = el("div", "mediarow");
      const media = document.createElement(rec.kind === "video" ? "video" : "img");
      media.className = "preview";
      media.controls = rec.kind === "video";
      media.src = "media/" + encodeURIComponent(name);
      mediaRow.appendChild(media);
      if (rec.kind === "still") {
        const failOpen = el("button", "", "Log failed video");
        failOpen.type = "button";
        const failBox = el("div", "editbox");
        const fail = document.createElement("textarea");
        fail.placeholder = "video prompt that failed on this still";
        const failBtn = el("button", "", "Add");
        failBtn.type = "button";
        failOpen.onclick = (ev) => { ev.stopPropagation(); failBox.classList.toggle("on"); };
        failBtn.onclick = (ev) => {
          ev.stopPropagation();
          if (!fail.value.trim()) return;
          const id = "miss-" + Date.now();
          records.set(id, {
            id, file: "", kind: "video", status: "fail", style: rec.style, tags: [],
            prompt: fail.value.trim(), notes: "", parent: rec.id, date: new Date().toISOString().slice(0, 10), stars: 0
          });
          document.getElementById("status").textContent = "Failed video logged.";
          scheduleSave();
          render();
        };
        failBox.append(fail, failBtn);
        mediaRow.appendChild(failOpen);
        detail.append(mediaRow, failBox);
      } else detail.appendChild(mediaRow);
      if (document.getElementById("collapsed").checked && (childNames || []).length) {
        const row = el("div", "tiles");
        childNames.forEach(k => row.appendChild(makeTile(k)));
        detail.appendChild(row);
      }
      if (rec.kind === "still" && hideClips) {
        const kids = childOf.get(rec.id) || [];
        if (kids.length) {
          const row = el("div", "tiles");
          kids.forEach(k => row.appendChild(makeTile(k)));
          detail.appendChild(row);
        }
      }
      const status = document.createElement("select");
      status.className = "wide";
      ["pass", "fail", "partial"].forEach(v => {
        const o = document.createElement("option");
        o.value = v; o.textContent = v;
        if (rec.status === v) o.selected = true;
        status.appendChild(o);
      });
      const style = document.createElement("select");
      style.className = "wide";
      const blank = document.createElement("option");
      blank.value = ""; blank.textContent = "style";
      style.appendChild(blank);
      styles.forEach(s => {
        const o = document.createElement("option");
        o.value = s; o.textContent = s;
        if (rec.style === s) o.selected = true;
        style.appendChild(o);
      });
      const chosen = parents.find(p => rec.parent === p.id || rec.parent === guidOf(p.file));
      const sameConv = parents.filter(p => convsOf(rec).some(id => convsOf(p).includes(id)) && p.id !== rec.id);
      const current = el("button", "", chosen ? "" : "no parent");
      current.type = "button";
      current.style.width = "auto";
      if (chosen) {
        const img = el("img", "thumb");
        img.src = chosen.file;
        current.appendChild(img);
      }
      const change = el("button", "", "Change parent");
      change.type = "button";
      change.style.width = "auto";
      const pick = el("div", "pick");
      const none = el("button", "", "none");
      none.type = "button";
      none.onclick = (ev) => { ev.stopPropagation(); rec.parent = null; apply(); render(); };
      pick.appendChild(none);
      parents.forEach(p => {
        if (p.id === rec.id) return;
        const b = document.createElement("button");
        b.type = "button";
        if (chosen && p.id === chosen.id) b.className = "on";
        const img = el("img");
        img.src = p.file;
        b.appendChild(img);
        b.onclick = (ev) => { ev.stopPropagation(); rec.parent = p.id; apply(); render(); };
        pick.appendChild(b);
      });
      change.onclick = (ev) => { ev.stopPropagation(); pick.classList.toggle("open"); };
      const nsfw = document.createElement("input");
      nsfw.type = "checkbox";
      nsfw.checked = !!rec.nsfw;
      const nsfwLabel = el("label", "inline", " nsfw");
      nsfwLabel.prepend(nsfw);
      const tags = document.createElement("input");
      tags.className = "wide";
      tags.placeholder = "tags, comma separated";
      tags.value = (rec.tags || []).join(", ");
      const prompt = document.createElement("textarea");
      prompt.placeholder = "prompt";
      prompt.value = rec.prompt || "";
      const notes = document.createElement("textarea");
      notes.placeholder = "notes";
      notes.value = rec.notes || "";
      const convLine = el("div", "", convsOf(rec).join(", ") || "no conversation");
      const convInput = document.createElement("input");
      convInput.className = "wide";
      convInput.placeholder = "conversation ids, comma separated";
      convInput.value = convsOf(rec).join(", ");
      convInput.style.display = "none";
      const tagLine = el("div", "", (rec.tags || []).join(", ") || "no tags");
      const styleLine = el("div", "", (rec.style || "no style") + (rec.nsfw ? "  ·  nsfw" : ""));
      const notesLine = el("div", "notes", rec.notes || "");
      const title = el("div", "title", labelOf(rec, name));
      const titleInput = document.createElement("input");
      titleInput.className = "wide";
      titleInput.value = rec.label || shortId(name);
      titleInput.style.display = "none";
      tags.style.display = "none";
      style.style.display = "none";
      nsfwLabel.style.display = "none";
      notes.style.display = "none";
      change.style.display = "none";
      const apply = () => {
        rec.style = style.value;
        rec.nsfw = nsfw.checked;
        rec.tags = tags.value.split(",").map(s => s.trim()).filter(Boolean);
        rec.prompt = promptView.value;
        rec.notes = notes.value;
        rec.conversation = convInput.value.trim();
        rec.label = titleInput.value.trim() === shortId(name) ? "" : titleInput.value.trim();
        title.textContent = labelOf(rec, name);
        tagLine.textContent = (rec.tags || []).join(", ") || "no tags";
        styleLine.textContent = (rec.style || "no style") + (rec.nsfw ? "  ·  nsfw" : "");
        notesLine.textContent = rec.notes || "";
        convLine.textContent = rec.conversation || "no conversation";
        if (!rec.date) rec.date = new Date().toISOString().slice(0, 10);
        document.getElementById("status").textContent = "Updated.";
        scheduleSave();
      };
      const facts = el("div", "facts");
      const promptView = document.createElement("textarea");
      promptView.readOnly = true;
      promptView.value = rec.prompt || "";
      promptView.rows = Math.min(16, Math.max(3, (rec.prompt || "").split("\n").length + 1));
      const copy = el("button", "", "Copy");
      copy.type = "button";
      copy.onclick = (ev) => {
        ev.stopPropagation();
        navigator.clipboard.writeText(promptView.value || "");
        document.getElementById("status").textContent = "Prompt copied.";
      };
      const promptRow = el("div", "promptrow");
      promptRow.append(promptView, copy);
      facts.append(promptRow, convLine, convInput, tagLine, tags, styleLine, style, nsfwLabel, notesLine, notes);
      const pencil = el("button", "", "✎");
      pencil.type = "button";
      let editing = false;
      pencil.onclick = (ev) => {
        ev.stopPropagation();
        if (editing) {
          apply();
          promptView.readOnly = true;
          title.style.display = "";
          titleInput.style.display = "none";
          tagLine.style.display = "";
          styleLine.style.display = "";
          notesLine.style.display = "";
          convLine.style.display = "";
          convInput.style.display = "none";
          tags.style.display = "none";
          style.style.display = "none";
          nsfwLabel.style.display = "none";
          notes.style.display = "none";
          change.style.display = "none";
          if (!chosen) change.remove();
          pick.classList.remove("open");
          editing = false;
          return;
        }
        editing = true;
        title.style.display = "none";
        titleInput.style.display = "";
        promptView.readOnly = false;
        tagLine.style.display = "none";
        styleLine.style.display = "none";
        notesLine.style.display = "none";
        convLine.style.display = "none";
        convInput.style.display = "";
        tags.style.display = "";
        style.style.display = "";
        nsfwLabel.style.display = "";
        notes.style.display = "";
        change.style.display = "";
        if (!chosen) facts.before(change);
      };
      const read = el("div", "readrow");
      if (chosen) {
        const parentnow = el("div", "parentnow");
        const img = el("img", "thumb");
        img.src = chosen.file;
        parentnow.appendChild(img);
        parentnow.appendChild(change);
        read.appendChild(parentnow);
      } else read.appendChild(change);
      read.appendChild(facts);
      detail.append(title, titleInput, read, pick, pencil);
      if (!(rec.prompt || "").trim()) pencil.onclick({ stopPropagation() {} });
    }
    li.append(tiles, detail);
    list.appendChild(li);
  }
  const groups = new Map();
  rows.forEach(name => {
    const ids = convsOf(recFor(name));
    if (!ids.length) {
      groups.set("file:" + name, [name]);
      return;
    }
    ids.forEach(id => {
      if (!groups.has(id)) groups.set(id, []);
      groups.get(id).push(name);
    });
  });
  const collapsed = document.getElementById("collapsed").checked;
  groups.forEach((names, id) => {
    const sorted = [...names].sort((a, b) => a.localeCompare(b));
    const marked = sorted.find(n => (recFor(n).cover || []).includes(id));
    const cover = marked || sorted[0];
    const convId = id.startsWith("file:") ? "" : id;
    if (collapsed) addGroup(cover, sorted.filter(n => n !== cover), convId);
    else addGroup(sorted[0], sorted.slice(1), convId);
    if (!marked && convId && !collapsed) {
      const tile = list.lastElementChild && list.lastElementChild.querySelector(".tilebtn");
      if (tile) tile.classList.add("candidate");
    }
  });
  [...records.values()].filter(r => r.id && r.id.startsWith("miss-") && wanted(r, r.prompt)).forEach(r => {
    const li = el("li", "group");
    const tiles = el("div", "tiles");
    const b = el("button", "tilebtn");
    b.type = "button";
    b.appendChild(el("div", "cap", (r.kind || "miss") + " fail"));
    b.appendChild(el("div", "meta", (r.prompt || "").slice(0, 80)));
    b.appendChild(starBar(r));
    b.onclick = () => li.classList.toggle("open");
    tiles.appendChild(b);
    const detail = el("div", "detail");
    detail.appendChild(el("div", "meta", r.parent ? "on " + r.parent : "no still"));
    const prompt = document.createElement("textarea");
    prompt.value = r.prompt || "";
    prompt.onchange = () => { r.prompt = prompt.value; };
    detail.append(starBar(r), prompt);
    li.append(tiles, detail);
    list.appendChild(li);
  });
}
function selectedTargets() {
  const names = new Set(picked);
  if (!document.getElementById("collapsed").checked) return [...names];
  picked.forEach(name => {
    convsOf(recFor(name)).forEach(id => {
      files.forEach(other => {
        if (convsOf(recFor(other)).includes(id)) names.add(other);
      });
    });
  });
  return [...names];
}
function showBulk() {
  const bar = document.getElementById("bulk");
  bar.classList.toggle("on", picked.size > 0);
  document.getElementById("bulkcount").textContent = selectedTargets().length + " selected";
  const sel = document.getElementById("bulkstyle");
  if (!sel.options.length) {
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = "style";
    sel.appendChild(blank);
    styles.forEach(s => {
      const o = document.createElement("option");
      o.value = s; o.textContent = s;
      sel.appendChild(o);
    });
  }
}
let saveTimer = 0;
async function saveCatalog() {
  const res = await fetch("/api/catalog", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify([...records.values()])
  });
  document.getElementById("status").textContent = res.ok ? "Saved catalog.js" : "Save failed.";
}
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCatalog, 1500);
}
function bind(id, event, fn) {
  const n = document.getElementById(id);
  if (n) n[event] = fn;
}
function savePrefs() {
  const prefs = {};
  ["q", "fstatus", "fkind", "fstyle", "ftag", "frate", "fnsfw", "sort", "scale", "collapsed"].forEach(id => {
    const n = document.getElementById(id);
    if (n) prefs[id] = n.type === "checkbox" ? n.checked : n.value;
  });
  localStorage.setItem("imagine-log", JSON.stringify(prefs));
}
function loadPrefs() {
  let prefs = {};
  try { prefs = JSON.parse(localStorage.getItem("imagine-log") || "{}"); } catch (err) {}
  Object.entries(prefs).forEach(([id, value]) => {
    const n = document.getElementById(id);
    if (n && value != null) { if (n.type === "checkbox") n.checked = value === true || value === "true"; else n.value = value; }
  });
  if (prefs.scale) document.documentElement.style.setProperty("--tile", prefs.scale + "px");
}
function filtersOn() {
  const on = ["q", "fstatus", "fkind", "fstyle", "ftag", "frate", "fnsfw"].some(id => {
    const n = document.getElementById(id);
    return n && n.value;
  });
  const btn = document.getElementById("clearfilters");
  if (btn) btn.hidden = !on;
}
bind("q", "oninput", () => { savePrefs(); render(); filtersOn(); });
bind("sort", "onchange", () => { savePrefs(); render(); });
bind("scale", "oninput", () => {
  document.documentElement.style.setProperty("--tile", document.getElementById("scale").value + "px");
  savePrefs();
});
bind("fstatus", "onchange", () => { savePrefs(); render(); filtersOn(); });
bind("fkind", "onchange", () => { savePrefs(); render(); filtersOn(); });
bind("fstyle", "onchange", () => { savePrefs(); render(); filtersOn(); });
bind("ftag", "onchange", () => { savePrefs(); render(); filtersOn(); });
bind("frate", "onchange", () => { savePrefs(); render(); filtersOn(); });
bind("fnsfw", "onchange", () => { savePrefs(); render(); filtersOn(); });
bind("collapsed", "onchange", () => { savePrefs(); render(); });
bind("missopen", "onclick", () => document.getElementById("missbox").classList.toggle("on"));
bind("missadd", "onclick", () => {
  const prompt = document.getElementById("missprompt").value.trim();
  if (!prompt) return;
  const id = "miss-" + Date.now();
  records.set(id, {
    id, file: "", kind: document.getElementById("misskind").value, status: "fail",
    style: "", tags: [], prompt, notes: "", parent: null, date: new Date().toISOString().slice(0, 10), stars: 0
  });
  document.getElementById("missprompt").value = "";
  document.getElementById("status").textContent = "Miss logged.";
  scheduleSave();
  render();
});
bind("match", "onclick", async () => {
  document.getElementById("status").textContent = "Matching first frames…";
  const pairs = await fetch("/api/match", { method: "POST" }).then(r => r.json());
  let n = 0;
  pairs.forEach(p => {
    const rec = records.get(p.video);
    if (!rec || rec.parent) return;
    rec.parent = p.still;
    n += 1;
  });
  document.getElementById("status").textContent = n + " clips linked. Save catalog.js to keep them.";
  render();
});
bind("save", "onclick", saveCatalog);
bind("bulkclear", "onclick", () => {
  picked.clear();
  document.querySelectorAll(".tilebtn.picked").forEach(b => b.classList.remove("picked"));
  document.getElementById("status").textContent = "Selection cleared.";
  showBulk();
});
bind("clearfilters", "onclick", () => {
  ["q", "fstatus", "fkind", "fstyle", "ftag", "frate", "fnsfw"].forEach(id => {
    const n = document.getElementById(id);
    if (n) n.value = "";
  });
  savePrefs();
  render();
  filtersOn();
});
bind("bulkaddtags", "onclick", () => {
  const tags = document.getElementById("bulktags").value.split(",").map(s => s.trim()).filter(Boolean);
  if (!tags.length) return;
  selectedTargets().forEach(id => {
    const rec = records.get(stemOf(id));
    if (!rec) return;
    const have = new Set((rec.tags || []).map(t => t.toLowerCase()));
    rec.tags = rec.tags || [];
    tags.forEach(t => { if (!have.has(t.toLowerCase())) rec.tags.push(t); });
  });
  document.getElementById("status").textContent = "Tags added.";
  scheduleSave();
  render();
});
bind("bulkdelete", "onclick", async () => {
  const names = selectedTargets();
  if (!names.length || !confirm("Delete " + names.length + " file(s) from the catalog and from media/?")) return;
  const res = await fetch("/api/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(names)
  });
  const data = await res.json();
  names.forEach(name => records.delete(stemOf(name)));
  files = files.filter(name => !names.includes(name));
  picked.clear();
  document.getElementById("status").textContent = (data.removed || []).length + " deleted from disk.";
  scheduleSave();
  showBulk();
  render();
});
bind("bulkapply", "onclick", () => {
  const style = document.getElementById("bulkstyle").value;
  const tags = document.getElementById("bulktags").value.split(",").map(s => s.trim()).filter(Boolean);
  const prompt = document.getElementById("bulkprompt").value;
  selectedTargets().forEach(id => {
    const rec = records.get(stemOf(id));
    if (!rec) return;
    if (style) rec.style = style;
    if (tags.length) rec.tags = tags;
    if (prompt) rec.prompt = prompt;
    const mark = document.getElementById("bulknsfw").value;
    if (mark === "yes") rec.nsfw = true;
    if (mark === "no") rec.nsfw = false;
    if (!rec.date) rec.date = new Date().toISOString().slice(0, 10);
  });
  document.getElementById("status").textContent = "Applied to " + selectedTargets().length + ".";
  scheduleSave();
  picked.clear();
  showBulk();
  render();
});
loadAll().catch(err => {
  document.getElementById("status").textContent = err.message;
  document.getElementById("hint").textContent = err.stack || "";
});
</script>
</body>
</html>
